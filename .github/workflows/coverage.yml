name: Python coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: python -m coverage run -m unittest discover -s tests -p "test_*.py"
      - run: python -m coverage report --format=markdown | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - run: python -m coverage html
      - run: python -m coverage xml
      - uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: |
            output/coverage/html/
            output/coverage/coverage.xml
          if-no-files-found: error
          retention-days: 14
