[tool.ruff]
target-version = "py311"
extend-exclude = ["build*", "output", "extracted"]

[tool.ruff.lint]
# Start with syntax, invalid control flow, and undefined-name errors.
# Formatting and style changes are deliberately outside this initial gate.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = ["tools"]
relative_files = true
data_file = "output/coverage/.coverage"

[tool.coverage.report]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "output/coverage/html"

[tool.coverage.xml]
output = "output/coverage/coverage.xml"
