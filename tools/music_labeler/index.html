<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shinka · Instrument notebook</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1625'/%3E%3Cpath d='M8 22V10h6v12m4 0V6h6v16' fill='none' stroke='%237ebeff' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><aside><header><span class="brand">SHINKA</span><h1>Instrument notebook</h1><p id="total">Loading your library…</p></header>
<label class="search">Find a track or area<input id="search" type="search" placeholder="Badlands, Asuka, battle…"></label>
<label class="check"><input id="unfinished" type="checkbox"> Only tracks with unlabeled parts</label>
<nav id="tracks" aria-label="Tracks"></nav><footer><a href="/api/labels" download="shinka-instrument-labels.json">Export labels</a><p>Labels save to a local file.</p></footer></aside>
<main><div id="notice" role="status" aria-live="polite"></div><section id="workspace"></section></main>
<datalist id="instruments"><option>Piano</option><option>String synth</option><option>Violin</option><option>Bell</option><option>Flute</option><option>Accordion</option><option>Harp</option><option>Triangle</option><option>Timpani</option><option>Bass</option><option>Drums</option></datalist>
</body></html>
